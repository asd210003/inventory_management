<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class="container">
    <br>
    <h1 class="display-5 text-center mt-3">Manage Product</h1>
    <br>
    <hr>
    <form th:action="@{/manageProduct}" th:object="${product}" method="POST">
        <div class="row justify-content-center">
            <div class="m-3 border col-md-6">

                <p><input th:field="*{product_id}" type="hidden"></p>

                <label class="row form-label p-2 fw-semibold">Product Name
                    <input th:field="*{name}" type="text" class="form-control">
                </label>
                <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="small text-danger fw-lighter"></p>
                <label class="row form-label p-2 fw-semibold">Product Description
                    <input th:field="*{description}" type="text" class="form-control">
                </label>
                <p th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="small text-danger fw-lighter"></p>
                <label class="row form-label p-2 fw-semibold">Product Price
                    <input th:field="*{price}" type="text" class="form-control">
                </label>
                <p th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="small text-danger fw-lighter"></p>
                <label class="row form-label p-2 fw-semibold">Product Quantity
                    <input th:field="*{quantity}" type="text" class="form-control">
                </label>
                <p th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}" class="small text-danger fw-lighter"></p>
                <div class="mb-3 clearfix">
                    <button type="submit" class="btn btn-primary">Update</button>
                    <a th:href="@{/homepage}" class="btn btn-secondary">Cancel</a>
                    <a th:href="@{/deleteProduct(id=${product.product_id})}" class="btn btn-danger float-end"
                        onclick="if(!(confirm('Are you sure you want to delete this product?')))return false">Delete</a>
                </div>
                <p th:if="${bundleError}" th:text="${bundleError}" class="small text-danger fw-lighter mt-2"></p>
            </div>
        </div>
    </form>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
