<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <br>
        <h1 class="display-5 text-center mt-3">Inventory Manager</h1>
        <br>
        <hr>
        <div class="d-flex align-items-center gap-3">
            <h3>Products</h3>
            <a th:href="@{/addProduct}" class="btn btn-sm btn-outline-secondary" style="height: 30px">Add Product</a>
        </div>
        <br>
        <div style="max-height: 300px; overflow-y: auto;">
            <table class="table table-hover shadow-sm">
                <thead class="table-light sticky-top">
                    <tr>
                        <th scope="col">Product ID</th>
                        <th scope="col">Product Name</th>
                        <th scope="col">Product Price</th>
                        <th scope="col">Product Quantity</th>
                        <th scope="col">Product Description</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(products)}">
                        <td colspan="6" class="text-center">No Parts Available to Show</td>
                    </tr>
                    <tr th:each="p : ${products}">
                        <td th:text="${p.product_id}"></td>
                        <td th:text="${p.name}"></td>
                        <td th:text="${p.price}"></td>
                        <td th:text="${p.quantity}"></td>
                        <td th:text="${p.description}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <br>
        <div class="d-flex align-items-center gap-3">
            <h3>Bundles</h3>
            <a th:href="@{/addBundle}" class="btn btn-sm btn-outline-secondary" style="height: 30px">Add Bundle</a>
        </div>
        <br>
        <div style="max-height: 300px; overflow-y: auto;">
            <table class="table table-hover shadow-sm">
                <thead class="table-light sticky-top">
                    <tr>
                        <th scope="col">Bundle ID</th>
                        <th scope="col">Bundle Name</th>
                        <th scope="col">Bundle Price</th>
                        <th scope="col">Bundle Quantity</th>
                        <th scope="col">Bundle Description</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(bundles)}">
                        <td colspan="6" class="text-center">No Bundles Available to Show</td>
                    </tr>
                    <tr th:each="b : ${bundles}">
                        <td th:text="${b.bundle_id}"></td>
                        <td th:text="${b.name}"></td>
                        <td th:text="${b.price}"></td>
                        <td th:text="${b.quantity}"></td>
                        <td th:text="${b.description}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
