<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Bundles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class="container">
    <br>
    <h1 class="display-5 text-center mt-3">Add Bundle</h1>
    <br>
    <hr>
    <form th:action="@{/addBundle}" th:object="${bundle}" method="POST">
        <div class="row justify-content-center">
            <div class="m-3 border col-md-6">
                <label class="row p-3 form-label fw-semibold">Bundle Name
                    <input th:field="*{name}" type="text" class="form-control">
                </label>
                <label class="row p-3 form-label fw-semibold">Bundle Description
                    <input th:field="*{description}" type="text" class="form-control">
                </label>
                <label class="row p-3 form-label fw-semibold">Bundle Price
                    <input th:field="*{price}" type="text" class="form-control">
                </label>
                <label class="row p-3 form-label fw-semibold">Bundle Quantity
                    <input th:field="*{quantity}" type="text" class="form-control">
                </label>
            </div>
            <div class="mb-3">
                <button type="submit" class="btn btn-primary">Continue to Products</button>
                <a th:href="@{/homepage}" class="btn btn-secondary">Cancel</a>
            </div>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
