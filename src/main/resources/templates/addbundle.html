<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class="container">
    <br>
    <h1 class="display-5 text-center mt-3">Add Bundle</h1>
    <br>
    <hr>
    <form th:action="@{/addBundle}">
        <div class="row justify-content-center">
            <div class="m-3 border p-3 col-md-6">
                <label class="form-label fw-semibold">Bundle Name</label>
                <input type="text" class="form-control mb-3">
                <label class="form-label fw-semibold">Bundle Description</label>
                <input type="text" class="form-control mb-3">
                <label class="form-label fw-semibold">Bundle Price</label>
                <input type="text" class="form-control mb-3">
                <label class="form-label fw-semibold">Bundle Quantity</label>
                <input type="text" class="form-control mb-3">
                <button type="submit" class="btn btn-primary">Add Product</button>
                <a th:href="@{/homepage}" class="btn btn-secondary">Cancel</a>
            </div>
        </div>
    </form>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
